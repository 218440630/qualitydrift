[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "218440630-qualitydrift"
version = "0.1.0"
description = "用线上采样打分并追踪趋势，标出拐点与可能的诱因"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "218440630" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://218440630.github.io"
Repository = "https://github.com/218440630/qualitydrift"
Issues = "https://github.com/218440630/qualitydrift/issues"

[project.scripts]
qualitydrift = "qualitydrift:main"

[tool.setuptools]
py-modules = ["qualitydrift"]
